name: Create draft release with assets
description: Creates a draft GitHub release and attaches asset files found under the given paths
inputs:
  asset-paths:
    required: true
    description: Comma-separated paths/globs passed to Get-ChildItem, e.g. "nugets/, powershellModules/, assets/"
  tag-name:
    required: true
    description: Tag name for the release
  repo-name:
    required: true
    description: Repository name
  sha:
    required: true
    description: Commit sha the release is created at
  github-token:
    required: true
    description: Token used by gh CLI to create the release
runs:
  using: composite
  steps:
    - name: Create draft release and attach assets
      shell: pwsh
      run: |
        $paths = '${{ inputs.asset-paths }}' -split ',' | ForEach-Object { $_.Trim() }
        $assets = (Get-ChildItem -Path $paths -File -Recurse).FullName
        Write-Output "Assets to attach: $assets"
        Write-Output "Creating draft release for ${{ inputs.repo-name }} ${{ inputs.tag-name }} at commit ${{ inputs.sha }}"
        gh release create ${{ inputs.tag-name }} $assets -d -n "<!-- RELEASE PENDING -->" -t "${{ inputs.tag-name }}"
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
