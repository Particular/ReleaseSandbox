  footer-heading: Where to get it
  footer-content: You can download this release from [NuGet](https://www.nuget.org/profiles/ParticularSoftware/).
issue-labels-include:
  - \"Bug\"
  - \"Feature\"
  - \"Improvement\"
  - \"Dependency CVE\"
issue-labels-exclude:
  - \"Refactoring\"" > GitReleaseManager.yaml
          echo GitReleaseManager.yaml contents
          cat GitReleaseManager.yaml
