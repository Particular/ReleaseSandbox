name: Release with GitReleaseManager
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: staging
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
          # source-url: ${{ vars.FEED_URL}}
        env:
          NUGET_AUTH_TOKEN: ${{secrets.FEED_TOKEN}}
      - name: Setup GitReleaseManager 
        # https://github.com/GitTools/GitReleaseManager#net-global-tool
        run: |
          dotnet tool install --global GitReleaseManager.Tool
          echo "templates-dir: .templates
create:
