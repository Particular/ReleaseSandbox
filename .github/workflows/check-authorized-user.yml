name: Check Authorized User
on:
  workflow_call:
jobs:
  check-authorized-user:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Verify authorized user
        run: |
          $actor = "${{ github.actor }}"
          $authorizedUsers = "${{ vars.AUTHORIZED_RELEASE_USERS }}" -split ',' | ForEach-Object { $_.Trim() }
          if ($authorizedUsers -notcontains $actor) {
            Write-Error "User '$actor' is not authorized to run this workflow. Authorized users: $($authorizedUsers -join ', ')"
            exit 1
          }
          Write-Output "User '$actor' is authorized to run this workflow."
