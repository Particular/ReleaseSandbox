name: Deploy Production
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
jobs:
  check-authorized-user:
    uses: Particular/deployment-workflows/.github/workflows/authorize-user.yml@0.0.1
  publish-release-notes:
    needs: check-authorized-user
    uses: Particular/deployment-workflows/.github/workflows/publish-release-notes.yml@0.0.1
    with:
      version: ${{ inputs.version }}
    secrets: inherit
  virus-scan:
    needs: publish-release-notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Scan release for viruses
        uses: Particular/virus-scan-action@main
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          tag: ${{ inputs.version }}
          github-access-token: ${{ secrets.GITHUB_TOKEN }}
          slack-token: ${{ secrets.SLACK_TOKEN }}
          slack-channel: ${{ vars.VIRUS_REPORTING_SLACK_CHANNEL }}
  push-nuget-packages:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    environment: production
    needs: publish-release-notes
    steps:
        - name: Push NuGet packages
          uses: particular/deployment-workflows/.github/actions/push-nuget-packages@combine-push-nuget-package-steps
          with:
            version: ${{ inputs.version }}
            release-state: published
            publish-mode: trusted-publishing
            nuget-user: ${{ secrets.TEST_NUGET_USER }}
            feed-url: ${{ vars.NUGET_PACKAGES_FEED_URL }}
            exclude-package-pattern: "TotallyLegit.ServiceControl.Management.*.nupkg"
  push-docker-images:
    needs: publish-release-notes
    uses: Particular/deployment-workflows/.github/workflows/push-docker-images.yml@0.0.1
  push-powershell-packages:
    needs: publish-release-notes
    uses: Particular/deployment-workflows/.github/workflows/push-powershell-packages.yml@0.0.1
    with:
      version: ${{ inputs.version }}
      package-pattern: "TotallyLegit.ServiceControl.Management.*.nupkg"
    secrets: inherit
  push-release-info-to-aws-s3:
    needs: publish-release-notes
    uses: Particular/deployment-workflows/.github/workflows/push-release-info-to-aws-s3.yml@0.0.1
    with:
      version: ${{ inputs.version }}
      product: "TotallyLegit.App"
      bucket: "testing.platformupdate.particular.net"
    secrets: inherit
