name: Deploy Production
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag / release name to publish (e.g. 1.2.3)'
        required: true
        type: string
  repository_dispatch:
    types: [deploy-production]
jobs:
  release-production:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Resolve version
        id: version
        # Accepts the version from either trigger: workflow_dispatch's input
        # or repository_dispatch's client_payload (e.g. sent by the Staging
        # workflow once the release notes have been filled in).
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = "${{ github.event.client_payload.version }}" }
          if (-not $version) { throw "No version supplied via workflow_dispatch input or repository_dispatch client_payload." }
          Write-Output "Version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Setup GitReleaseManager
        # https://github.com/GitTools/GitReleaseManager#net-global-tool
        run: dotnet tool install --global GitReleaseManager.Tool
      - name: Publish release
        run: |
          Write-Output "Publishing release ${{ steps.version.outputs.version }} for ${{ github.event.repository.name }}"
          dotnet-gitreleasemanager publish --token $env:GITHUB_TOKEN -o "${{ github.repository_owner }}" -r "${{ github.event.repository.name }}" -t "${{ steps.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  push-nuget-packages:
    permissions:
      id-token: write
    needs: release-production
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Download assets from release
        run: |
          gh release download "${{ needs.release-production.outputs.version }}" --repo "${{ github.repository }}" --pattern "*.nupkg" --dir nugets
          Get-ChildItem nugets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Get NuGet trusted publishing API key
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.TEST_NUGET_USER }}
          token-service-url: https://int.nugettest.org/api/v2/token
      - name: Push NuGet packages to production feed
        run: |
          Get-ChildItem nugets
          dotnet nuget push nugets/*.nupkg --source https://int.nugettest.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}}
  virus-scan:
    needs: release-production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Scan release for viruses
        uses: Particular/virus-scan-action@main
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          tag: ${{ needs.release-production.outputs.version }}
          github-access-token: ${{ secrets.GITHUB_TOKEN }}
          slack-token: ${{ secrets.SLACK_TOKEN }}
          slack-channel: ${{ vars.VIRUS_REPORTING_SLACK_CHANNEL }}
