name: Deploy Production
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag / release name to publish (e.g. 1.2.3)'
        required: true
        type: string
jobs:
  publish-release-notes:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Setup GitReleaseManager
        # https://github.com/GitTools/GitReleaseManager#net-global-tool
        run: dotnet tool install --global GitReleaseManager.Tool
      - name: Publish release
        run: |
          Write-Output "Publishing release ${{ inputs.version }} for ${{ github.event.repository.name }}"
          dotnet-gitreleasemanager publish --token $env:GITHUB_TOKEN -o "${{ github.repository_owner }}" -r "${{ github.event.repository.name }}" -t "${{ inputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  virus-scan:
    needs: publish-release-notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Scan release for viruses
        uses: Particular/virus-scan-action@main
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          tag: ${{ inputs.version }}
          github-access-token: ${{ secrets.GITHUB_TOKEN }}
          slack-token: ${{ secrets.SLACK_TOKEN }}
          slack-channel: ${{ vars.VIRUS_REPORTING_SLACK_CHANNEL }}
  push-nuget-packages:
    permissions:
      id-token: write
    needs: publish-release-notes
    uses: ./.github/workflows/push-nuget-packages.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
  push-docker-images:
    needs: publish-release-notes
    uses: ./.github/workflows/push-docker-images.yml
  push-powershell-packages:
    needs: publish-release-notes
    uses: ./.github/workflows/push-powershell-packages.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
