name: Deploy Staging
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
jobs:
  push-nuget-packages-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Push NuGet packages
        uses: Particular/deployment-workflows/.github/actions/push-nuget-packages@1.0.0
        with:
          version: ${{ inputs.version }}
          deploy-environment: staging
          exclude-package-pattern: "TotallyLegit.ServiceControl.Management.*.nupkg"
          api-key: ${{ secrets.FEEDZIO_PUBLISH_API_KEY }}
  generate-release-notes:
    uses: Particular/deployment-workflows/.github/workflows/generate-release-notes.yml@1.0.0
    with:
      version: ${{ inputs.version }}
    secrets: inherit
