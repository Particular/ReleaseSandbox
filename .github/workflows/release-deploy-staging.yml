name: Deploy Staging
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
jobs:
  check-authorized-user:
    uses: Particular/deployment-workflows/.github/workflows/authorize-user.yml@0.0.1
  push-nuget-packages-staging:
    needs: check-authorized-user
    permissions:
      id-token: write
      contents: write
    uses: Particular/deployment-workflows/.github/workflows/push-nuget-packages-staging.yml@0.0.1
    with:
      version: ${{ inputs.version }}
      exclude-package-pattern: "TotallyLegit.ServiceControl.Management.*.nupkg"
    secrets: inherit
  generate-release-notes:
    needs: check-authorized-user
    uses: Particular/deployment-workflows/.github/workflows/generate-release-notes.yml@0.0.1
    with:
      version: ${{ inputs.version }}
    secrets: inherit
